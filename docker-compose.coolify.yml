# Coolify HTTPS Reverse Proxy Exposure Mode Override
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.coolify.yml up -d
#
# Coolify's Traefik reverse proxy automatically provisions Let's Encrypt certificates
# and routes the HTTPS domain to the container's internal port:
#   ${ANKI_MCP_DOMAIN} -> anki-mcp:8000
# NOTE: The !override tag requires Docker Compose >= 2.24. Without it, Compose
# APPENDS ports from the base file instead of replacing them.

services:
  anki-mcp:
    # Disable direct host port exposure so all traffic goes through Coolify's Traefik
    ports: !override []
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.http.routers.anki-mcp.rule=Host(`${ANKI_MCP_DOMAIN}`)"
      - "traefik.http.routers.anki-mcp.entrypoints=websecure"
      - "traefik.http.routers.anki-mcp.tls=true"
      - "traefik.http.routers.anki-mcp.tls.certresolver=letsencrypt"
      - "traefik.http.services.anki-mcp.loadbalancer.server.port=8000"
