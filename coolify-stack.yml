# Zero-touch Coolify stack: paste, set the domain on the anki-mcp service,
# deploy. No environment variables are required and the data volume is created
# automatically — on first boot the service provisions its own secrets
# (0600, inside the volume):
#   • SESSION_SECRET      -> generated at /data/.session_secret (stable across
#                            restarts; set the env var to override)
#   • initial admin login -> generated and recorded in
#                            /data/initial-admin-password.txt
#                            (read it via your platform's container exec:
#                             cat /data/initial-admin-password.txt)
#
# The image is published by .github/workflows/docker-image.yml. If your GHCR
# package is private, either make it public (Package settings) or add GHCR
# credentials in Coolify. Building from source instead works with a git-based
# Coolify compose resource — swap `image:` for the commented `build:` block.

services:
  anki-mcp:
    image: ghcr.io/thies2005/anki-webmcp:latest
    # build:
    #   context: ./docker/mcp-service
    #   dockerfile: Dockerfile
    restart: unless-stopped
    # Container-only port; the platform's HTTPS proxy routes the domain here.
    # Deliberately no `ports:` — no plain-HTTP exposure on the host.
    expose:
      - "8000"
    environment:
      # All optional — unset/empty means "self-provision on first boot".
      - SESSION_SECRET=${SESSION_SECRET:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - FORCE_SECURE_COOKIES=${FORCE_SECURE_COOKIES:-true}
      - TZ=${TZ:-UTC}
      - MAINTENANCE_MODE=${MAINTENANCE_MODE:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - IDLE_TIMEOUT_MINUTES=${IDLE_TIMEOUT_MINUTES:-15}
      - MAX_OPEN_COLLECTIONS=${MAX_OPEN_COLLECTIONS:-5}
      - MAX_CONCURRENT_SYNCS=${MAX_CONCURRENT_SYNCS:-2}
      - BACKUP_RETENTION=${BACKUP_RETENTION:-20}
      # Pre-tool AnkiWeb sync: full two-way sync before every MCP tool call
      # (pulls remote state AND pushes pending local changes).
      - SYNC_BEFORE_TOOLS=${SYNC_BEFORE_TOOLS:-true}
      - SYNC_BEFORE_TOOLS_TTL_SECONDS=${SYNC_BEFORE_TOOLS_TTL_SECONDS:-1800}
      # Comma-separated proxy IPs whose X-Forwarded-For may override the
      # socket peer for request.client.host (login rate limiting). Behind
      # Coolify's Traefik, set this to the proxy network (or "*" — the
      # service is only reachable through the platform proxy).
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-127.0.0.1}
    volumes:
      - anki_mcp_data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  anki_mcp_data:
