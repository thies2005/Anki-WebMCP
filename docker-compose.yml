# Core Production Docker Compose Configuration
# Single headless multi-user service: anki-mcp serves the Streamable HTTP MCP
# endpoint (/mcp), the token portal, and the admin UI on port 8000.

services:
  anki-mcp:
    build:
      context: ./docker/mcp-service
      dockerfile: Dockerfile
    image: anki-mcp:latest
    container_name: anki-mcp
    restart: unless-stopped
    environment:
      # Fail-closed: the service refuses to start without a real SESSION_SECRET.
      - SESSION_SECRET=${SESSION_SECRET}
      # First-boot bootstrap only: create the initial admin when the store is empty.
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - TZ=${TZ:-UTC}
      - MAINTENANCE_MODE=${MAINTENANCE_MODE:-false}
      - IDLE_TIMEOUT_MINUTES=${IDLE_TIMEOUT_MINUTES:-15}
      - MAX_OPEN_COLLECTIONS=${MAX_OPEN_COLLECTIONS:-5}
      - MAX_CONCURRENT_SYNCS=${MAX_CONCURRENT_SYNCS:-2}
      - BACKUP_RETENTION=${BACKUP_RETENTION:-5}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - mcp_data:/data
    ports:
      # Port 8000 serves /mcp, the token portal, and /admin. For a purely local
      # setup, bind to loopback instead: "127.0.0.1:8000:8000". For public
      # exposure, keep TLS termination in front (see the exposure-mode override
      # files: Cloudflare Tunnel or Coolify HTTPS reverse proxy).
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  mcp_data:
    name: mcp_data
