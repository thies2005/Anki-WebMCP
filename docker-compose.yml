# Core Production Docker Compose Configuration
# Single headless multi-user service: anki-mcp serves the Streamable HTTP MCP
# endpoint (/mcp), the token portal, and the admin UI on port 8000.

services:
  anki-mcp:
    build:
      context: ./docker/mcp-service
      dockerfile: Dockerfile
    image: anki-mcp:latest
    container_name: anki-mcp
    restart: unless-stopped
    environment:
      # Fail-closed: the service refuses to start without a real SESSION_SECRET.
      - SESSION_SECRET=${SESSION_SECRET}
      # First-boot bootstrap only: create the initial admin when the store is empty.
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - TZ=${TZ:-UTC}
      - MAINTENANCE_MODE=${MAINTENANCE_MODE:-false}
      - IDLE_TIMEOUT_MINUTES=${IDLE_TIMEOUT_MINUTES:-15}
      - MAX_OPEN_COLLECTIONS=${MAX_OPEN_COLLECTIONS:-5}
      - MAX_CONCURRENT_SYNCS=${MAX_CONCURRENT_SYNCS:-2}
      - BACKUP_RETENTION=${BACKUP_RETENTION:-20}
      # Pre-tool AnkiWeb sync: full two-way sync before every MCP tool call
      # (pulls remote state AND pushes pending local changes).
      - SYNC_BEFORE_TOOLS=${SYNC_BEFORE_TOOLS:-true}
      # Per-user cooldown for that sync (0 = sync before every call).
      - SYNC_BEFORE_TOOLS_TTL_SECONDS=${SYNC_BEFORE_TOOLS_TTL_SECONDS:-1800}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Set true when serving HTTPS through a reverse proxy so session/flash
      # cookies carry the Secure attribute.
      - FORCE_SECURE_COOKIES=${FORCE_SECURE_COOKIES:-false}
      # Comma-separated proxy IPs whose X-Forwarded-For may override the
      # socket peer for request.client.host (login rate limiting). Set to the
      # proxy/tunnel network, or "*" when the service is only reachable
      # through the proxy.
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-127.0.0.1}
    volumes:
      - mcp_data:/data
    ports:
      # Secure by default: bind to loopback only, so the portal/admin (which
      # serve tokens and credentials) are never exposed to the LAN unprotected.
      # To expose the port (e.g. on your LAN), add your own compose overlay
      # overriding `ports:` — the `!override` pattern in the cloudflare/coolify
      # files shows how. The README's recommended exposure modes (Cloudflare
      # tunnel / reverse proxy) are unaffected by this binding.
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  mcp_data:
    name: mcp_data
