# Publishes the anki-mcp image to GHCR so zero-touch deployments (e.g. a
# pasted Coolify compose stack) can pull a ready image instead of building
# from source. Multi-arch (amd64 + arm64); the anki wheel ships both.
#
# NOTE: packages built from a PRIVATE repository start private. For anonymous
# pulls from Coolify, flip the package to public once (GitHub -> your profile
# -> Packages -> Anki-WebMCP -> Package settings -> Change visibility), or
# configure GHCR credentials in Coolify instead.
name: docker-image

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docker-image.yml"
      - "docker/mcp-service/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: docker/mcp-service
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
