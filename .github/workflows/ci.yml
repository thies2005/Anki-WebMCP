name: CI

# Tests run on every push and pull request. The multi-arch image is built on
# every run; it is pushed to GHCR only from branch/tag pushes (main -> latest,
# v* tags -> semver), never from pull requests (build-only).
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: anki-mcp

jobs:
  tests:
    name: Test suite
    runs-on: ubuntu-latest
    env:
      # Fail-closed setting; the service refuses to start without it.
      # Tests set their own secrets explicitly, this only mirrors a real boot.
      SESSION_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docker/mcp-service/requirements.txt

      - name: Install dependencies
        run: pip install -r docker/mcp-service/requirements.txt pytest pytest-asyncio respx

      - name: Run test suite
        run: python -m pytest tests/ -q

  images:
    name: Multi-arch image (amd64/arm64)
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: docker/mcp-service
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
