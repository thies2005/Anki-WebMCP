# Cloudflare Tunnel Exposure Mode Override
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.cloudflare.yml up -d
#
# Routes traffic securely through an outbound Cloudflare Tunnel. Configure the
# public hostname in the Cloudflare Dashboard (Networks -> Tunnels -> ingress):
#   <your-domain> -> HTTP -> anki-mcp:8000
# (port 8000 serves /mcp, the token portal, and /admin — this is the only
# container port that needs an ingress rule)
#
# No router ports or firewall rules need to be opened.
# NOTE: The !override tag requires Docker Compose >= 2.24. Without it, Compose
# APPENDS ports from the base file instead of replacing them.

services:
  # In Cloudflare Tunnel mode, prevent direct public exposure of host ports
  anki-mcp:
    ports: !override
      - "127.0.0.1:8000:8000"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    # The tunnel token is passed via the TUNNEL_TOKEN environment variable, not
    # the command line: process arguments are world-readable across users via
    # /proc/<pid>/cmdline and ps, while the environment block is owner-only.
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    depends_on:
      - anki-mcp
